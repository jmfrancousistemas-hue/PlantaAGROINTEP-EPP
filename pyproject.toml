[project]
name = "plantaagrointep-epp"
version = "0.1.0"
description = "Inspección visual y verificación de elementos de práctica para AGROINTEP"
readme = "README.md"
requires-python = ">=3.10, <3.13"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "opencv-python>=4.9,<5",
    "scikit-learn",
    "joblib",
    "mlflow",
    "tensorflow>=2.16",
    "requests",
    "pyyaml",
    "fastapi",
    "uvicorn",
    "python-multipart",
]

[tool.uv.workspace]
